[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "espn-api-lib"
version = "0.1.0"
description = "Lightweight Python client for ESPN public endpoints (NFL first)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Brendan Kenney" }]
dependencies = [
  "aiohttp>=3.9",
  # add others you actually import, e.g. "pydantic>=2" if you use it
]

[project.urls]
Homepage = "https://github.com/brendankenney8/ESPN_API_Lib"
Issues = "https://github.com/brendankenney8/ESPN_API_Lib/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/espn_api_lib"]
